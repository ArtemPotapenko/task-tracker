syntax = "proto3";

package task.v1;

option go_package = "task-tracker/proto-lib/gen/public/task;taskpb";

import "google/api/annotations.proto";
import "validate/validate.proto";

enum TaskStatus {
  TASK_STATUS_UNKNOWN = 0;
  TASK_STATUS_CREATED = 1;
  TASK_STATUS_AT_WORK = 2;
  TASK_STATUS_COMPLETED = 3;
  TASK_STATUS_EXPIRED = 4;
}

message Task {
  int64 id = 1;
  int64 user_id = 2;
  string description = 3;
  TaskStatus status = 4;
  int64 created_at = 5;
  int64 due_date = 6;
}

message GetTaskRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0];
}

message GetTasksRequest {}

message CreateTaskRequest {
  string description = 1 [(validate.rules).string.min_len = 1];
  int64 due_date = 2 [(validate.rules).int64.gt = 0];
}

message UpdateTaskStatusRequest {
  int64 id = 1 [(validate.rules).int64.gt = 0];
  TaskStatus status = 2 [(validate.rules).enum = {
    defined_only: true
    not_in: [0, 4]
  }];
}

message TaskResponse {
  Task task = 1;
}

message TasksResponse {
  repeated Task tasks = 1;
}

service TaskService {
  rpc GetTask(GetTaskRequest) returns (TaskResponse) {
    option (google.api.http) = {
      get: "/v1/tasks/{id}"
    };
  }
  rpc GetTodayTasks(GetTasksRequest) returns (TasksResponse) {
    option (google.api.http) = {
      get: "/v1/tasks/today"
    };
  }
  rpc CreateTask(CreateTaskRequest) returns (TaskResponse) {
    option (google.api.http) = {
      post: "/v1/tasks"
      body: "*"
    };
  }
  rpc UpdateTaskStatus(UpdateTaskStatusRequest) returns (TaskResponse) {
    option (google.api.http) = {
      patch: "/v1/tasks/{id}/status"
      body: "*"
    };
  }
}
